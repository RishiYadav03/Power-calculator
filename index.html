<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100" style="background-image: url('image.jpg'); background-repeat: no-repeat; background-size: cover; background-position: center;">
    
    <div class="card p-4 shadow rounded-4 bg-dark-subtle text-dark-emphasis w-100 mx-3" style="max-width: 450px;">
        <h4 class="text-center mb-3">Power Calculator</h4>

        <div class="mb-3">
            <label for="NumberInput" class="form-label">Enter Number :</label>
            <input type="number" class="form-control" id="NumberInput" placeholder="e.g. 5">
        </div>

        <div class="d-flex justify-content-between flex-wrap gap-2">
            <button class="btn btn-primary flex-fill" id="x1">Square</button>
            <button class="btn btn-primary flex-fill" id="x2">Cube</button>
            <button class="btn btn-primary flex-fill" id="x3">Positive</button>
        </div>

        <div class="mt-3">
            <p id="result" class="fw-bold text-success ps-2"></p>
        </div>
    </div>

    <script src="power.js"></script>
</body>
</html>
